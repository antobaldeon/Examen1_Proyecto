      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3307/product_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=mysql123
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spring-cloud-network

  # ---------------- INVENTORY ----------------
  inventory-service:
    build:
      context: ./Services/inventory-service
    container_name: inventory-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8089
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://service-registry:8762/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3307/inventory_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=mysql123
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
