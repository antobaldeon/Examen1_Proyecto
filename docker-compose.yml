      - spring-cloud-network

  # ---------------- ORDER ----------------
  order-service:
    build:
      context: ./Services/order-service
    container_name: order-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8089
