      - spring-cloud-network

  # ---------------- PAYMENT ----------------
  payment-service:
    build:
      context: ./Services/payment-service
    container_name: payment-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8089
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://service-registry:8762/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3307/payments_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=mysql123
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spring-cloud-network

  # ---------------- FRONTEND ----------------
  frontend:
    build:
      context: ./frontend-V
    container_name: angular-frontend
    ports:
      - "80:80"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - spring-cloud-network