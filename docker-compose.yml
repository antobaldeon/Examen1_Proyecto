networks:
  spring-cloud-network:
    driver: bridge

services:
  # ---------------- CONFIG SERVER ----------------
  config-server:
    build:
      context: ./Infraestructura/config-server
    container_name: config-server
    ports:
      - "8089:8089"
    environment:
      - SPRING_PROFILES_ACTIVE=native
    networks:
      - spring-cloud-network
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 8089 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------- EUREKA ----------------
  service-registry:
    build:
      context: ./Infraestructura/service-registry
    container_name: service-registry
    ports:
      - "8762:8762"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - JAVA_TOOL_OPTIONS=-Deureka.client.register-with-eureka=false -Deureka.client.fetch-registry=false -Deureka.instance.hostname=service-registry
    networks:
      - spring-cloud-network
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 127.0.0.1 8762 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------- API GATEWAY ----------------
  api-gateway:
    build:
      context: ./Infraestructura/api-gateway
    container_name: api-gateway
    ports:
      - "8061:8061"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8089
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://service-registry:8762/eureka/
      - SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWEDORIGINS=http://localhost,http://localhost:4200,http://127.0.0.1
      - SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWEDMETHODS=GET,POST,PUT,DELETE,OPTIONS
      - SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWEDHEADERS=*
      - SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_[/**]_ALLOWCREDENTIALS=true
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    networks:
      - spring-cloud-network

  # ---------------- AUTH ----------------
  auth-service:
    build:
      context: ./Infraestructura/auth-service
    container_name: auth-service
    ports:
      - "8088:8088"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8089
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://service-registry:8762/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3307/usuario_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=mysql123
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spring-cloud-network

  # ---------------- USUARIO ----------------
  usuario-service:
    build:
      context: ./Infraestructura/usuario-service
    container_name: usuario-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8089
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://service-registry:8762/eureka/
      - SPRING_DATASOURCE_URL=jdbc:mysql://host.docker.internal:3307/usuario_db?allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=mysql123
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=false
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - spring-cloud-network

  # ---------------- PRODUCT ----------------
  product-service:
    build:
      context: ./Services/product-service
    container_name: product-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8089
