<main class="login-wrapper">
  <section class="login-panel-left">
    <div class="brand" aria-label="ITMAC Future">
      <img src="/itmac-logo.svg" alt="ITMAC Future" />
    </div>

    <p class="login-title">LOGIN</p>
    <p class="login-subtitle">Ingrese sus datos</p>

    <div class="login-error" *ngIf="errorMessage" role="alert">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="login()" class="login-form">
      <label class="itmac-input-group">
        <span class="input-icon">✉</span>
        <input
          class="itmac-input"
          type="email"
          name="email"
          [(ngModel)]="request.email"
          placeholder="Correo electrónico"
          autocomplete="email"
          required
        />
      </label>

      <label class="itmac-input-group">
        <span class="input-icon">●</span>
        <input
          class="itmac-input"
          type="password"
          name="password"
          [(ngModel)]="request.password"
          placeholder="Contraseña"
          autocomplete="current-password"
          required
        />
      </label>

      <button type="submit" class="btn-itmac" [disabled]="enviando">
        {{ enviando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
    <p class="login-register">
      ¿No tienes cuenta?
      <a routerLink="/register">Registrate aqui</a>
    </p>
  </section>

  <section class="login-panel-right" aria-hidden="true">
    <div class="login-promo-card">
      <p class="login-promo-text">Lo mejor<br />para tu<br />taller.</p>
      <div class="promo-mark">
        <span>ITMAC</span>
        <small>FUTURE</small>
      </div>
    </div>
  </section>
</main>
