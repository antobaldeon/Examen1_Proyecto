<header class="site-header">
  <a class="brand" routerLink="/" aria-label="ITMAC Future">
    <img src="/itmac-logo.svg" alt="ITMAC Future" />
  </a>

  <nav class="main-nav" aria-label="Navegacion principal">
    <a routerLink="/">Productos</a>
    <a routerLink="/" fragment="categorias">Categorias</a>
    <a routerLink="/" fragment="contacto">Contacto</a>
  </nav>

  <div class="header-actions">
    <ng-container *ngIf="isLoggedIn; else guestActions">
      <a
        *ngIf="isAdmin"
        class="admin-icon-button"
        routerLink="/admin"
        aria-label="Abrir panel de administracion"
        title="Administracion">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm9.2 5.2-2-.7a7.8 7.8 0 0 0 0-1.4l2-.7-1.5-3.5-1.9.9c-.3-.4-.7-.7-1-1l.9-1.9-3.5-1.5-.7 2a7.8 7.8 0 0 0-1.4 0l-.7-2-3.5 1.5.9 1.9c-.4.3-.7.7-1 1l-1.9-.9-1.5 3.5 2 .7a7.8 7.8 0 0 0 0 1.4l-2 .7 1.5 3.5 1.9-.9c.3.4.7.7 1 1l-.9 1.9 3.5 1.5.7-2a7.8 7.8 0 0 0 1.4 0l.7 2 3.5-1.5-.9-1.9c.4-.3.7-.7 1-1l1.9.9 1.5-3.5Z"/>
        </svg>
      </a>

      <div class="account-menu">
        <button
          class="account-button"
          type="button"
          (click)="toggleAccountMenu()"
          aria-label="Abrir opciones de cuenta">
          <span>{{ email }}</span>
          <small>{{ roleLabel }}</small>
        </button>

        <div class="account-dropdown" *ngIf="accountMenuOpen">
          <button type="button" (click)="logout()">Cerrar sesion</button>
        </div>
      </div>

      <button class="cart-button" type="button" (click)="goToCart()" aria-label="Abrir carrito">
        <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2ZM6.2 6l.7 3.4 1 5.1c.2.9 1 1.5 1.9 1.5h7.7c.8 0 1.6-.5 1.9-1.3L22 8H7.1l-.4-2H2V4h3c.6 0 1.1.4 1.2 1Z"/>
        </svg>
        <span>Carrito</span>
        <strong *ngIf="totalItems > 0">{{ totalItems }}</strong>
      </button>
    </ng-container>

    <ng-template #guestActions>
      <div class="auth-actions">
        <a routerLink="/login">Iniciar sesion</a>
        <span>/</span>
        <a routerLink="/register">Registrarse</a>
      </div>
    </ng-template>
  </div>
</header>
