<header class="site-header">
  <a class="brand" routerLink="/products" aria-label="ITMAC Future">
    <img src="/itmac-logo.svg" alt="ITMAC Future" />
  </a>

  <nav class="main-nav" aria-label="Navegación principal">
    <ng-container *ngIf="isAdmin">
      <a routerLink="/admin">Panel</a>
      <a routerLink="/admin/products">Productos</a>
      <a routerLink="/admin/inventory">Inventario</a>
      <a routerLink="/admin/orders">Órdenes</a>
    </ng-container>

    <ng-container *ngIf="isCliente">
      <a routerLink="/products" fragment="categorias">Productos</a>
      <a routerLink="/my-orders">Mis pedidos</a>
    </ng-container>

    <ng-container *ngIf="!isLoggedIn">
      <a routerLink="/products" fragment="categorias">Productos</a>
    </ng-container>
  </nav>

  <div class="header-actions">
    <a
      *ngIf="isAdmin"
      class="admin-icon-button"
      routerLink="/admin"
      aria-label="Abrir panel de administración"
      title="Administración"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm9.2 5.2-2-.7a7.8 7.8 0 0 0 0-1.4l2-.7-1.5-3.5-1.9.9c-.3-.4-.7-.7-1-1l.9-1.9-3.5-1.5-.7 2a7.8 7.8 0 0 0-1.4 0l-.7-2-3.5 1.5.9 1.9c-.4.3-.7.7-1 1l-1.9-.9-1.5 3.5 2 .7a7.8 7.8 0 0 0 0 1.4l-2 .7 1.5 3.5 1.9-.9c.3.4.7.7 1 1l-.9 1.9 3.5 1.5.7-2a7.8 7.8 0 0 0 1.4 0l.7 2 3.5-1.5-.9-1.9c.4-.3.7-.7 1-1l1.9.9 1.5-3.5Z"
        />
      </svg>
    </a>

    <div class="account-copy" *ngIf="isLoggedIn">
      <span>{{ displayName }}</span>
      <small>{{ roleLabel }}</small>
    </div>

    <button
      *ngIf="!isAdmin"
      class="cart-button"
      (click)="goToCart()"
      aria-label="Abrir carrito"
    >
      <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2ZM6.2 6l.7 3.4 1 5.1c.2.9 1 1.5 1.9 1.5h7.7c.8 0 1.6-.5 1.9-1.3L22 8H7.1l-.4-2H2V4h3c.6 0 1.1.4 1.2 1Z"
        />
      </svg>
      <span>Carrito</span>
      <strong *ngIf="totalItems > 0">{{ totalItems }}</strong>
    </button>

    <button *ngIf="!isLoggedIn" class="logout-button" (click)="goToLogin()">
      Ingresar
    </button>
    <button *ngIf="isLoggedIn" class="logout-button" (click)="logout()">
      Salir
    </button>
  </div>
</header>
