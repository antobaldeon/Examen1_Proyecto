eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8762/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    instance-id: ${spring.application.name}:${server.port}

spring:
  cloud:
    gateway:
      httpclient:
        response-timeout: 120s
        connect-timeout: 10000
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost"
              - "http://localhost:*"
              - "http://127.0.0.1"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - Location
            allowCredentials: true
      routes:
        - id: product-image-upload
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products/images
          order: -1
          metadata:
            response-timeout: 120000
            connect-timeout: 10000

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products,/api/v1/products/**
          filters:
            - name: CircuitBreaker
              args:
                name: productServiceGateway

        - id: inventory-create
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/v1/inventory
            - Method=POST
          order: -1
          metadata:
            response-timeout: 120000
            connect-timeout: 10000

        - id: inventory-service
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/v1/inventory,/api/v1/inventory/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryServiceGateway

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders,/api/v1/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceGateway

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payments,/api/v1/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentServiceGateway

        - id: usuario-service
          uri: lb://USUARIO-SERVICE
          predicates:
            - Path=/api/v1/usuarios,/api/v1/usuarios/**

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth,/api/v1/auth/**


management:
  tracing:
    sampling:
      probability: 1.0
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,refresh
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      productServiceGateway:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED

      inventoryServiceGateway:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED

      orderServiceGateway:
        registerHealthIndicator: true
        eventConsumerBufferSize: 10
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED

  retry:
    instances:
      productServiceGateway:
        maxAttempts: 5
        waitDuration: 10s

      inventoryServiceGateway:
        maxAttempts: 5
        waitDuration: 10s

      orderServiceGateway:
        maxAttempts: 5
        waitDuration: 10s

  timelimiter:
    instances:
      productServiceGateway:
        timeoutDuration: 120s
        cancelRunningFuture: false

      inventoryServiceGateway:
        timeoutDuration: 120s
        cancelRunningFuture: false

      orderServiceGateway:
        timeoutDuration: 120s
        cancelRunningFuture: false

      paymentServiceGateway:
        timeoutDuration: 120s
        cancelRunningFuture: false
