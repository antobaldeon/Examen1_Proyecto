server:
  port: 8084

spring:
  cloud:
    discovery:
      enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

google:
  drive:
    enabled: ${GOOGLE_DRIVE_ENABLED:true}
    folder-id: ${GOOGLE_DRIVE_FOLDER_ID:15Dbbtu0UvmawOs0Wrmsgqmo79tzmsiQq}
    credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:C:/Users/mygna/Downloads/project-9ec6f28f-ed34-43cd-92e-76acecbe8a4b.json}
    auth-mode: ${GOOGLE_DRIVE_AUTH_MODE:oauth}
    public-images: ${GOOGLE_DRIVE_PUBLIC_IMAGES:true}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8762/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    instance-id: ${spring.application.name}:${server.port}

management:
  tracing:
    sampling:
      probability: 1.0
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,refresh
  endpoint:
    health:
      show-details: always
